<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Communications Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind via Vite -->
    <link href="/style.css" rel="stylesheet">
    <script src="/config.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex selection:bg-indigo-100 selection:text-indigo-900">
    
    <!-- Sidebar / Navigation -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 hidden md:flex">
      <div class="h-20 flex items-center px-8">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
          <div>
            <h1 class="text-xl font-extrabold tracking-tight text-slate-900">DocuAI</h1>
            <p class="text-[10px] font-bold text-indigo-600 uppercase tracking-widest leading-none">Intelligence</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
        <button data-route="upload" class="nav-btn nav-btn-active w-full">
          <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          Upload Received
        </button>

        <button data-route="agent" class="nav-btn nav-btn-inactive w-full">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
          AI Agent
        </button>
      </nav>
      <div class="p-6 border-t border-slate-100 bg-slate-50/50">
        <div class="flex items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-sm shadow-sm">
            US
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50/50">
      <!-- Mobile Header -->
      <header class="md:hidden h-16 bg-white border-b border-slate-200 flex items-center px-4 shrink-0">
        <h1 class="text-lg font-bold text-indigo-600">DocuAI</h1>
      </header>

      <!-- Dynamic View Container -->
      <div id="app-container" class="flex-1 overflow-y-auto p-4 md:p-8">
        <!-- Views injected via JS -->
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
