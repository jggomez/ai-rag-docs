[project]
name = "ai-doc-communications"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "fastapi>=0.135.3",
    "google-api-python-client>=2.170.0",
    "google-auth-httplib2>=0.2.0",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-storage>=3.4.1",
    "google-genai>=1.2.0",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langchain-text-splitters>=1.1.1",
    "mlflow[genai]>=3.13.0",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "reportlab>=4.5.1",
    "ruff>=0.15.10",
    "uvicorn>=0.44.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
